name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release metadata
        run: pnpm release:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Real CLI fleet install, update, and recovery
        run: python3 scripts/cli-dogfood.py --evidence-dir "${{ runner.temp }}/cli-dogfood"

      - name: Upload CLI timings and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-dogfood
          path: ${{ runner.temp }}/cli-dogfood/commands.jsonl

      - name: Test
        run: pnpm test
