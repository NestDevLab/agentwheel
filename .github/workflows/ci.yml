name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release metadata
        run: pnpm release:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Real isolated local-run-as service install
        run: sudo env GITHUB_ACTIONS=true PATH="$PATH" python3 scripts/run-as-smoke.py --isolated-ci --cli "$PWD/dist/index.js" --node "$(command -v node)"

      - name: Real CLI fleet install, update, and recovery
        run: python3 scripts/cli-dogfood.py --evidence-dir "${{ runner.temp }}/cli-dogfood"

      - name: Upload CLI timings and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-dogfood
          path: ${{ runner.temp }}/cli-dogfood/commands.jsonl

      - name: Checkout pinned Syncwheel provider source
        uses: actions/checkout@v6
        with:
          repository: NestDevLab/syncwheel
          ref: acd4c69058b2841fe7aa0b60542e87258821a875 # 0.46.0: journal revision-provider support
          path: syncwheel

      - name: Verify Syncwheel provider source
        run: |
          test -f syncwheel/VERSION
          test -f syncwheel/scripts/syncwheel.py
          test -f syncwheel/scripts/syncwheel_revision_provider.py

      - name: Test
        env:
          SYNCWHEEL_SOURCE_ROOT: ${{ github.workspace }}/syncwheel
        run: pnpm test
