name = "nestdev-agentwheel-catalogue-share"
main = "catalogue-share-worker.js"
compatibility_date = "2026-07-23"
account_id = "784045e41f2091e73f0f16ad359a5800"

routes = [
  { pattern = "www.nestdev.it/agentwheel/share/*", zone_name = "nestdev.it" },
  { pattern = "www.nestdev.it/agentwheel/catalogue/*", zone_name = "nestdev.it" },
]

[build]
command = "node build-catalogue-assets.mjs"
watch_dir = ["catalogue-share-worker.js", "catalogue-assets.js", "build-catalogue-assets.mjs", "../docs/catalogue.html"]

[assets]
directory = ".catalogue-assets"
binding = "ASSETS"
run_worker_first = true
