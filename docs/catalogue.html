<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse agentwheel-installable resources from the official registry, Vercel skills.sh, and SkillKit-compatible repositories.">
  <meta property="og:title" content="Catalogue - agentwheel">
  <meta property="og:description" content="Browse agentwheel-installable resources from the official registry, Vercel skills.sh, and SkillKit-compatible repositories.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.nestdev.it/agentwheel/catalogue.html">
  <meta name="twitter:card" content="summary">
  <title>Catalogue - agentwheel</title>
  <link rel="icon" href="./favicon.png" type="image/png">
  <style>
    :root {
      color-scheme: dark;
      --text: #f8fafc;
      --muted: #9ca3af;
      --line: rgba(148, 163, 184, 0.2);
      --indigo: #4f46e5;
      --violet: #7c3aed;
      --cyan: #06b6d4;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.36);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 12%, rgba(79, 70, 229, 0.2), transparent 28rem),
        radial-gradient(circle at 82% 18%, rgba(6, 182, 212, 0.16), transparent 26rem),
        linear-gradient(180deg, #0d1117 0%, #0b0f16 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--indigo);
      outline-offset: 3px;
    }

    .wrap {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 20px 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 760;
      letter-spacing: 0;
    }

    .brand img {
      width: 38px;
      height: 38px;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 18px;
      color: var(--muted);
      font-size: 16px;
    }

    .logo-link,
    .icon-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(17, 24, 39, 0.6);
      color: #cbd5e1;
      transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .logo-link img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(6, 182, 212, 0.22));
    }

    .icon-link svg {
      width: 18px;
      height: 18px;
    }

    .logo-link:hover,
    .icon-link:hover {
      border-color: rgba(6, 182, 212, 0.45);
      background: rgba(6, 182, 212, 0.1);
      color: #e5e7eb;
      transform: translateY(-1px);
    }

    .nav a:hover,
    footer a:hover,
    .resource-link:hover {
      color: #e5e7eb;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .catalogue-hero {
      padding: 30px 0 22px;
    }

    .catalogue-hero-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }

    .catalogue-hero-copy {
      min-width: 0;
    }

    h1 {
      max-width: 760px;
      margin: 0 0 12px;
      font-size: clamp(42px, 5vw, 66px);
      line-height: 1.04;
      letter-spacing: 0;
      text-wrap: balance;
    }

    .gradient-title {
      display: inline-block;
      padding-bottom: 0.14em;
      margin-bottom: -0.06em;
      background: linear-gradient(135deg, var(--indigo), var(--violet), var(--cyan));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subhead {
      max-width: 790px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(19px, 2vw, 22px);
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      min-height: 38px;
      padding: 0 13px;
      border: 1px solid transparent;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 800;
    }

    .button.secondary {
      border-color: rgba(124, 58, 237, 0.46);
      background: rgba(17, 24, 39, 0.72);
      color: #e5e7eb;
    }

    .button.secondary:hover {
      border-color: rgba(196, 181, 253, 0.72);
      background: rgba(124, 58, 237, 0.16);
    }

    .button.primary {
      border-color: rgba(34, 211, 238, 0.48);
      background: linear-gradient(135deg, var(--indigo), var(--violet));
      color: #fff;
      cursor: pointer;
    }

    .button.primary:hover:not(:disabled) {
      border-color: rgba(165, 243, 252, 0.82);
      filter: brightness(1.08);
    }

    .button:disabled {
      cursor: wait;
      opacity: 0.64;
    }

    .semantic-demo {
      position: relative;
      margin: 16px 0 8px;
      padding: 16px;
      overflow: hidden;
      border: 1px solid rgba(103, 232, 249, 0.28);
      border-radius: 18px;
      background:
        radial-gradient(circle at 90% 8%, rgba(6, 182, 212, 0.14), transparent 22rem),
        linear-gradient(135deg, rgba(17, 24, 39, 0.94), rgba(30, 27, 75, 0.58));
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.22);
    }

    .semantic-demo h2 {
      margin: 0;
      font-size: clamp(22px, 3vw, 29px);
      line-height: 1.12;
    }

    .semantic-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      margin-top: 16px;
    }

    .semantic-form input[type="search"] {
      min-width: 0;
      padding: 0 14px;
      border-color: rgba(103, 232, 249, 0.28);
    }

    .semantic-examples {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .semantic-example {
      padding: 4px 8px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.54);
      color: #cbd5e1;
      font: inherit;
      cursor: pointer;
    }

    .semantic-example:hover {
      border-color: rgba(103, 232, 249, 0.46);
      color: #ecfeff;
    }

    .semantic-progress-wrap {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }

    .semantic-progress-wrap[hidden] {
      display: none;
    }

    .semantic-progress-wrap progress {
      width: 100%;
      height: 8px;
      overflow: hidden;
      border: 0;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.14);
      accent-color: var(--cyan);
    }

    .semantic-progress-wrap progress::-webkit-progress-bar {
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.14);
    }

    .semantic-progress-wrap progress::-webkit-progress-value {
      border-radius: 999px;
      background: linear-gradient(90deg, var(--indigo), var(--cyan));
    }

    .semantic-progress-wrap span,
    .semantic-status {
      color: var(--muted);
      font-size: 14px;
    }

    .semantic-status {
      min-height: 18px;
      margin: 10px 0 0;
    }

    .semantic-status[data-tone="success"] {
      color: #86efac;
    }

    .semantic-status[data-tone="warning"] {
      color: #fde68a;
    }

    .semantic-results h3 {
      margin: 17px 0 9px;
      color: #e5e7eb;
      font-size: 16px;
    }

    .semantic-result-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .semantic-result {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 9px;
      min-width: 0;
      padding: 12px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 12px;
      background: rgba(2, 6, 23, 0.44);
    }

    .semantic-rank {
      display: grid;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(79, 70, 229, 0.24);
      color: #c4b5fd;
      font-size: 14px;
      font-weight: 850;
      place-items: center;
    }

    .semantic-result h4 {
      margin: 1px 0 5px;
      overflow-wrap: anywhere;
      font-size: 16px;
      line-height: 1.25;
    }

    .semantic-result h4 a {
      color: #cffafe;
      text-decoration: underline;
      text-decoration-color: rgba(103, 232, 249, 0.5);
      text-underline-offset: 3px;
    }

    .semantic-result p {
      display: -webkit-box;
      margin: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.42;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    .semantic-result .semantic-result-meta {
      display: block;
      margin-top: 7px;
      color: #a5f3fc;
      font-weight: 700;
    }


    .controls-sticky {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 12px 0 14px;
      background: rgba(13, 17, 23, 0.78);
      backdrop-filter: blur(8px);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(17, 24, 39, 0.88);
      box-shadow: 0 18px 56px rgba(0, 0, 0, 0.22);
    }

    .search {
      position: relative;
      flex: 1 1 280px;
      min-width: 240px;
    }

    .search svg {
      position: absolute;
      left: 13px;
      top: 50%;
      width: 18px;
      height: 18px;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    input[type="search"],
    select {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #0b0f14;
      color: var(--text);
      font: inherit;
    }

    input[type="search"] {
      width: 100%;
      padding: 0 14px 0 42px;
    }

    input[type="search"]::placeholder {
      color: var(--muted);
    }

    select {
      padding: 0 34px 0 12px;
      color: #e5e7eb;
    }

    .chip-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chip:hover {
      border-color: rgba(203, 213, 225, 0.46);
      color: #e5e7eb;
    }

    .chip[aria-pressed="true"] {
      border-color: rgba(79, 70, 229, 0.72);
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.18), rgba(124, 58, 237, 0.14));
      color: var(--text);
    }

    section {
      padding: 24px 0 36px;
    }

    .section-title {
      max-width: 760px;
      margin: 0 0 24px;
      font-size: clamp(31px, 4vw, 46px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .result-count {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 16px;
    }

    .catalogue-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(290px, 100%), 1fr));
      gap: 16px;
    }

    .resource-card {
      display: flex;
      min-width: 0;
      min-height: 300px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(17, 24, 39, 0.88), rgba(15, 23, 42, 0.66));
      flex-direction: column;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .resource-card:hover {
      border-color: var(--accent-color, rgba(203, 213, 225, 0.46));
      box-shadow: var(--shadow);
      transform: translateY(-2px);
    }

    .card-top {
      display: flex;
      min-width: 0;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .card-title {
      min-width: 0;
    }

    .card-title h2 {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: 20px;
      line-height: 1.22;
      letter-spacing: 0;
    }

    .card-title h2 a {
      color: #f8fafc;
      text-decoration: underline;
      text-decoration-color: rgba(103, 232, 249, 0.44);
      text-decoration-thickness: 1.5px;
      text-underline-offset: 4px;
    }

    .card-title h2 a:hover {
      color: #cffafe;
      text-decoration-color: rgba(103, 232, 249, 0.9);
    }

    .version {
      display: inline-block;
      margin-left: 6px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
    }

    .badge {
      flex: 0 0 auto;
      padding: 5px 8px;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1;
      text-transform: uppercase;
    }

    .badge.official {
      background: rgba(79, 70, 229, 0.15);
      color: var(--indigo);
    }

    .badge.vercel {
      background: rgba(124, 58, 237, 0.15);
      color: var(--violet);
    }

    .badge.skillkit {
      background: rgba(6, 182, 212, 0.15);
      color: var(--cyan);
    }

    .badge.openpack {
      background: rgba(34, 197, 94, 0.14);
      color: #86efac;
    }

    .badge.mcp-registry {
      background: rgba(245, 158, 11, 0.14);
      color: #fcd34d;
    }

    .description {
      display: -webkit-box;
      min-height: 67px;
      margin: 0 0 14px;
      margin-top: 12px;
      overflow: hidden;
      color: var(--muted);
      font-size: 17px;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    .pill-list {
      display: flex;
      max-height: 27px;
      margin: 0 0 10px;
      gap: 8px;
      flex-wrap: wrap;
      overflow: hidden;
    }

    .pill {
      padding: 5px 8px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.08);
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.25;
    }

    .provides .pill {
      border-color: rgba(6, 182, 212, 0.22);
      background: rgba(6, 182, 212, 0.08);
      color: #bae6fd;
    }

    .meta {
      display: flex;
      align-items: center;
      min-height: 20px;
      margin: 2px 0 14px;
      gap: 7px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 14px;
    }

    .star {
      color: #eab308;
    }

    .archive {
      padding: 2px 7px;
      border: 1px solid rgba(234, 179, 8, 0.28);
      border-radius: 999px;
      color: #fde68a;
      background: rgba(234, 179, 8, 0.1);
      font-weight: 800;
    }

    .featured-chip {
      padding: 2px 7px;
      border: 1px solid rgba(124, 58, 237, 0.3);
      border-radius: 999px;
      color: #ddd6fe;
      background: rgba(124, 58, 237, 0.12);
      font-weight: 800;
    }

    .install {
      display: flex;
      min-width: 0;
      align-items: center;
      min-height: 48px;
      margin-top: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(2, 6, 23, 0.7);
      overflow: hidden;
    }

    .install code {
      flex: 1 1 auto;
      min-width: 0;
      padding: 13px 12px;
      overflow-x: auto;
      color: #dbeafe;
      font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: nowrap;
      scrollbar-width: thin;
    }

    .copy {
      align-self: stretch;
      min-width: 78px;
      margin-left: auto;
      border: 0;
      border-left: 1px solid var(--line);
      background: rgba(17, 24, 39, 0.72);
      color: #e5e7eb;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .copy:hover {
      background: rgba(79, 70, 229, 0.18);
    }

    .copy.copied {
      background: rgba(22, 163, 74, 0.18);
      color: #86efac;
    }

    .links {
      display: flex;
      min-width: 0;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 14px;
      color: #67e8f9;
      font-size: 16px;
      font-weight: 700;
    }

    .links a {
      color: #67e8f9;
      text-decoration: underline;
      text-decoration-color: rgba(103, 232, 249, 0.55);
      text-decoration-thickness: 1.5px;
      text-underline-offset: 4px;
    }

    .links a:hover {
      color: #cffafe;
      text-decoration-color: rgba(103, 232, 249, 0.96);
    }

    .detail-panel {
      margin: 20px 0 10px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(17, 24, 39, 0.92), rgba(15, 23, 42, 0.74));
    }

    body.detail-mode .catalogue-hero,
    body.detail-mode .controls-sticky {
      display: none;
    }

    body.detail-mode section[aria-labelledby="results-title"] {
      padding-top: 8px;
    }

    body.detail-mode .detail-panel {
      margin-top: 8px;
    }

    .detail-panel[hidden] {
      display: none;
    }

    .detail-actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .detail-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 14px;
    }

    .detail-top h2 {
      margin: 0;
      font-size: clamp(27px, 3.5vw, 38px);
      line-height: 1.1;
    }

    .detail-top p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .detail-links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .detail-links a,
    .resource-link {
      color: #67e8f9;
      font-weight: 800;
      text-decoration: underline;
      text-decoration-color: rgba(103, 232, 249, 0.55);
      text-decoration-thickness: 1.5px;
      text-underline-offset: 4px;
    }

    .detail-links a:hover,
    .resource-link:hover {
      color: #cffafe;
      text-decoration-color: rgba(103, 232, 249, 0.96);
    }

    .detail-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 14px 0 0;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr));
      gap: 14px;
      margin-top: 16px;
    }

    .detail-section {
      min-width: 0;
      padding: 12px 0 0;
      border-top: 1px solid rgba(148, 163, 184, 0.18);
    }

    .detail-section h3 {
      margin: 0 0 10px;
      color: #e5e7eb;
      font-size: 16px;
      line-height: 1.25;
    }

    .detail-list {
      display: grid;
      gap: 10px;
    }

    .detail-item {
      min-width: 0;
    }

    .detail-item-title {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      color: #e5e7eb;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .detail-item-title a {
      color: #67e8f9;
      text-decoration: underline;
      text-decoration-color: rgba(103, 232, 249, 0.55);
      text-decoration-thickness: 1.5px;
      text-underline-offset: 3px;
    }

    .detail-item-title a:hover {
      color: #cffafe;
      text-decoration-color: rgba(103, 232, 249, 0.96);
    }

    .detail-note {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
    }

    .detail-code {
      display: inline-block;
      max-width: 100%;
      padding: 2px 6px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.76);
      color: #dbeafe;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow-wrap: anywhere;
    }

    .detail-mini-install {
      min-height: 38px;
      margin-top: 8px;
    }

    .detail-mini-install code {
      padding: 9px 10px;
      font-size: 14px;
    }

    .detail-mini-install .copy {
      min-width: 64px;
      font-size: 14px;
    }

    .detail-item .pill-list {
      max-height: none;
      margin: 7px 0 0;
    }

    .show-more-row {
      display: flex;
      grid-column: 1 / -1;

    .show-more {
      min-height: 42px;
      padding: 0 16px;

      border-radius: 8px;
      background: rgba(17, 24, 39, 0.72);
      color: #e5e7eb;

      font-size: 16px;

    }

      border-color: rgba(203, 213, 225, 0.46);

    .state-panel {
      display: grid;
      grid-column: 1 / -1;
      min-height: 250px;
      padding: 32px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(17, 24, 39, 0.72);
      place-items: center;
      text-align: center;

    .state-panel svg {
      width: 46px;
      height: 46px;
      margin-bottom: 14px;
      color: var(--cyan);
    }

      margin: 0 0 8px;
      font-size: 22px;
    }

    .state-panel p {
      max-width: 420px;
      margin: 0;
      color: var(--muted);
    }

    .state-panel a {
      display: inline-block;
      margin-top: 14px;
      color: #cbd5e1;
      font-weight: 800;
    }

    .skeleton {
      min-height: 334px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(17, 24, 39, 0.88), rgba(15, 23, 42, 0.66));
    }

    .skeleton-line {
      height: 14px;
      margin-bottom: 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(148, 163, 184, 0.1), rgba(148, 163, 184, 0.24), rgba(148, 163, 184, 0.1));
      background-size: 220% 100%;
      animation: shimmer 1.25s ease-in-out infinite;
    }

    .skeleton-line.title {
      width: 66%;
      height: 20px;
      margin-bottom: 22px;
    }

    .skeleton-line.short {
      width: 42%;
    }

    .skeleton-line.medium {

    .skeleton-spacer {

    @keyframes shimmer {
      from {
        background-position: 120% 0;
      }
      to {
        background-position: -120% 0;
      }

    footer {

      justify-content: space-between;

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,

        scroll-behavior: auto !important;
        transition: none !important;
        animation: none !important;

    @media (max-width: 900px) {

        grid-template-columns: repeat(2, minmax(0, 1fr));

    @media (max-width: 640px) {
      .wrap {

  <script>
    const DEFAULT_DATA_URL = "https://raw.githubusercontent.com/NestDevLab/agentwheel-registry/main/catalogue-data.json";
    const PAGE_SIZE = 60;
    const params = new URLSearchParams(location.search);

    function detailResourceIdFromLocation() {
      const prefix = "/agentwheel/catalogue/";
      if (!location.pathname.startsWith(prefix)) return params.get("resource") || "";
      try {
        return decodeURIComponent(location.pathname.slice(prefix.length));
      } catch {
        return "";
      }
    }

    function dataUrlFromParam(value) {
      if (!value) return DEFAULT_DATA_URL;
      if (/^[a-zA-Z][a-zA-Z\d+.-]*:/.test(value) || value.startsWith("//")) return DEFAULT_DATA_URL;

      try {
        // Only relative same-origin ?data overrides are accepted; everything else uses production data.
        const u = new URL(value, location.href);
        return u.origin === location.origin ? u.href : DEFAULT_DATA_URL;
      } catch {
        return DEFAULT_DATA_URL;
      }
    }

    const DATA_URL = dataUrlFromParam(params.get("data"));
    const VERCEL_INDEX_URL = siblingUrl(DATA_URL, "catalogue-vercel-index.json");

    const state = {
      entries: [],
      filteredEntries: [],
      renderedCount: 0,
      query: params.get("q") || "",
      ecosystem: "all",
      resource: "all",
      sort: "stars",
      detailResourceId: detailResourceIdFromLocation(),
    };
    let resolveCatalogueReady;
    const catalogueReady = new Promise((resolve) => {
      resolveCatalogueReady = resolve;
    });
    window.agentwheelCatalogue = { ready: catalogueReady };

    const grid = document.querySelector("#grid");
    const count = document.querySelector("#count");
    const queryInput = document.querySelector("#q");
    const sortSelect = document.querySelector("#sort");
    const detailPanel = document.querySelector("#resource-detail");
    const resultsTitle = document.querySelector("#results-title");
    let searchTimer = 0;
    queryInput.value = state.query;
    document.body.classList.toggle("detail-mode", Boolean(state.detailResourceId));

    function siblingUrl(url, filename) {
      const u = new URL(url, location.href);
      u.pathname = u.pathname.replace(/[^/]*$/, filename);
      u.search = "";
      u.hash = "";
      return u.href;
    }

    function text(value) {
      return value == null ? "" : String(value);
    }

    function appendText(parent, value) {
      parent.textContent = text(value);
      return parent;
    }

    function safeUrl(value) {
      try {
        const url = new URL(String(value));
        return url.protocol === "https:" || url.protocol === "http:" ? url.href : null;
      } catch {
        return null;
      }
    }

    function ecosystemLabel(ecosystem) {
      if (ecosystem === "official") return "Official";
      if (ecosystem === "openpack") return "OpenPack";
      if (ecosystem === "mcp-registry") return "MCP registry";
      if (ecosystem === "clawhub") return "ClawHub";
      if (ecosystem === "vercel") return "Vercel skills";
      if (ecosystem === "skillkit") return "SkillKit";
      return ecosystem || "Unknown";
    }

    function ecosystemColor(ecosystem) {
      if (ecosystem === "official") return "var(--indigo)";
      if (ecosystem === "openpack") return "#86efac";
      if (ecosystem === "mcp-registry") return "#fcd34d";
      if (ecosystem === "clawhub") return "#fb923c";
      if (ecosystem === "vercel") return "var(--violet)";
      if (ecosystem === "skillkit") return "var(--cyan)";
      return "rgba(203, 213, 225, 0.46)";
    }

    function formatStars(stars) {
      if (typeof stars !== "number") return null;
      return new Intl.NumberFormat("en", { notation: stars >= 10000 ? "compact" : "standard" }).format(stars);
    }

    function formatDate(value) {
      if (!value) return null;
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return null;
      return date.toISOString().slice(0, 10);
    }

    function prepareEntry(entry) {
      const lastPushTime = entry.lastPush ? Date.parse(entry.lastPush) : -Infinity;
      const nameLower = text(entry.name).toLowerCase();
      const subtitleLower = text(entry.subtitle).toLowerCase();
      return {
        ...entry,
        nameLower,
        subtitleLower,
        exactMatchPriority: entry.ecosystem === "official" ? 0 : entry.featured ? 1 : 2,
        searchText: [
          entry.name,
          entry.description,
          entry.readmeExcerpt,
          entry.subtitle,
          ...(Array.isArray(entry.provides) ? entry.provides : []),
          ...(Array.isArray(entry.tags) ? entry.tags : []),
          ...(Array.isArray(entry.skills) ? entry.skills : []),
          ...(Array.isArray(entry.select) ? entry.select : []),
          ...(Array.isArray(entry.suggestedSkills) ? entry.suggestedSkills.map((item) => item?.name).filter(Boolean) : []),
        ].join(" ").toLowerCase(),
        lastPushTime: Number.isNaN(lastPushTime) ? -Infinity : lastPushTime,
      };
    }

    function vercelIndexEntry(record) {
      const owner = text(record.o);
      const repo = text(record.r);
      const skill = text(record.s);
      return prepareEntry({
        id: `vercel:${owner}/${repo}/${skill}`,
        name: skill,
        ecosystem: "vercel",
        type: "skill",
        description: typeof record.d === "string" ? record.d : "",
        tags: [],
        source: `vercel:skills.sh/${owner}/${repo}/${skill}`,
        installCommand: `npx agentwheel install "vercel:skills.sh/${owner}/${repo}/${skill}" --installation-type local`,
        repoUrl: `https://github.com/${owner}/${repo}`,
        homepageUrl: `https://skills.sh/${owner}/${repo}/${skill}`,
        stars: null,
        lastPush: null,
        archived: false,
        provides: null,
        version: null,
        featured: false,
        subtitle: `${owner}/${repo}`,
        homepageLinkLabel: "Verify on skills.sh",
      });
    }

    function matchTier(entry, query) {
      if (entry.nameLower === query) return 0;
      if (entry.nameLower.startsWith(query)) return 1;
      if (entry.nameLower.includes(query)) return 2;
      if (entry.subtitleLower.includes(query)) return 3;
      return 4;
    }

    function setPressed(group, value) {
      document.querySelectorAll(`[data-filter="${group}"]`).forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.value === value));
      });
    }

    function filterHasResults(group, value) {
      if (value === "all") return true;
      return state.entries.some((entry) => {
        if (group === "ecosystem") return entry.ecosystem === value;
        if (group === "resource") return resourceMatches(entry, value);
        return true;
      });
    }

    function resourceMatches(entry, value) {
      if (value === "package" || value === "adapter") return entry.type === value;
      if (value === "skills") return entry.type === "skill" || providesArtifact(entry, "skills");
      if (value === "plugins") return entry.type === "plugin" || providesArtifact(entry, "plugins");
      if (value === "mcp") return entry.type === "mcp" || providesArtifact(entry, "mcp");
      return providesArtifact(entry, value);
    }

    function providesArtifact(entry, value) {
      return Array.isArray(entry.provides) && entry.provides.includes(value);
    }

    function updateFilterVisibility() {
      const groups = new Set();
      document.querySelectorAll("[data-filter]").forEach((button) => {
        const group = button.dataset.filter;
        const value = button.dataset.value;
        groups.add(group);
        const visible = filterHasResults(group, value);
        button.hidden = !visible;
        button.disabled = !visible;
        if (!visible && state[group] === value) {
          state[group] = "all";
          setPressed(group, "all");
        }
      });

      groups.forEach((group) => {
        document.querySelectorAll(`[data-filter="${group}"]`).forEach((button) => {
          const groupEl = button.closest(".chip-group");
          if (!groupEl) return;
          const hasSpecificFilter = [...groupEl.querySelectorAll("[data-filter]")]
            .some((candidate) => candidate.dataset.value !== "all" && !candidate.hidden);
          groupEl.hidden = !hasSpecificFilter;
        });
      });
    }

    function clearGrid() {
      while (grid.firstChild) grid.removeChild(grid.firstChild);
    }

    function showSkeletons() {
      clearGrid();
      renderDetail();
      count.textContent = "Loading resources";
      for (let i = 0; i < 6; i += 1) {
        const card = document.createElement("article");
        card.className = "skeleton";
        card.setAttribute("aria-hidden", "true");
        ["title", "medium", "medium", "short"].forEach((name) => {
          const line = document.createElement("div");
          line.className = `skeleton-line ${name}`;
          card.appendChild(line);
        });
        const spacer = document.createElement("div");
        spacer.className = "skeleton-spacer";
        card.appendChild(spacer);
        const line = document.createElement("div");
        line.className = "skeleton-line medium";
        card.appendChild(line);
        grid.appendChild(card);
      }
    }

    function stateIcon(kind) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("aria-hidden", "true");
      svg.setAttribute("fill", "none");
      svg.setAttribute("stroke", "currentColor");
      svg.setAttribute("stroke-width", "1.8");
      svg.setAttribute("stroke-linecap", "round");
      svg.setAttribute("stroke-linejoin", "round");
      const paths = kind === "error"
        ? ["M12 9v4", "M12 17h.01", "M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"]
        : ["M4 6h16", "M4 12h10", "M4 18h7", "M18 14v6", "M15 17h6"];
      paths.forEach((d) => {
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", d);
        svg.appendChild(path);
      });
      return svg;
    }

    function showState(kind, title, message, countLabel) {
      clearGrid();
      count.textContent = countLabel || (kind === "empty" ? "0 resources" : "Catalogue data unavailable");
      const panel = document.createElement("div");
      panel.className = "state-panel";
      panel.appendChild(stateIcon(kind));
      panel.appendChild(appendText(document.createElement("h2"), title));
      panel.appendChild(appendText(document.createElement("p"), message));
      if (kind === "error") {
        const link = document.createElement("a");
        link.href = "https://github.com/NestDevLab/agentwheel-registry";
        link.textContent = "Open the registry repo";
        panel.appendChild(link);
      }
      grid.appendChild(panel);
    }

    function copyText(value, button, idleLabel = "Copy", successLabel = "✓ Copied") {
      const command = text(value);
      const done = () => {
        button.classList.add("copied");
        button.textContent = successLabel;
        window.setTimeout(() => {
          button.classList.remove("copied");
          button.textContent = idleLabel;
        }, 1500);
      };

      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(command).then(done).catch(() => fallbackCopy(command, done));
      } else {
        fallbackCopy(command, done);
      }
    }

    async function shareResource(entry, button) {
      const url = shareUrl(entry);
      if (navigator.share) {
        try {
          await navigator.share({ title: `${text(entry.name)} - Catalogue - agentwheel`, text: text(entry.description), url });
          return;
        } catch (error) {
          if (error?.name === "AbortError") return;
        }
      }
      copyText(url, button, "Share", "✓ Link copied");
    }

    function fallbackCopy(value, done) {
      const input = document.createElement("textarea");
      input.value = value;
      input.setAttribute("readonly", "");
      input.style.position = "fixed";
      input.style.opacity = "0";
      document.body.appendChild(input);
      input.select();
      try {
        if (document.execCommand("copy")) {
          done();
        }
      } finally {
        document.body.removeChild(input);
      }
    }

    function pillList(values, className) {
      const list = document.createElement("div");
      list.className = `pill-list ${className || ""}`.trim();
      values.slice(0, 8).forEach((value) => {
        const pill = document.createElement("span");
        pill.className = "pill";
        pill.textContent = text(value);
        list.appendChild(pill);
      });
      return list;
    }

    function detailUrl(entry) {
      const url = new URL(location.origin);
      url.pathname = `/agentwheel/catalogue/${encodeURIComponent(entry.id)}`;
      return url.href;
    }

    function shareUrl(entry) {
      return detailUrl(entry);
    }

    function catalogueUrl() {
      const url = new URL(location.origin);
      url.pathname = "/agentwheel/catalogue.html";
      return url.href;
    }

    function cardHref(entry) {
      if (entry.relatedOnly) return entry.sourceUrl || entry.homepageUrl || catalogueSearchUrl(entry.name);
      return shareUrl(entry);
    }

    function appendResourceLink(parent, href, label) {
      const safe = safeUrl(href);
      if (!safe) return;
      const link = document.createElement("a");
      link.className = "resource-link";
      link.href = safe;
      link.textContent = label;
      parent.appendChild(link);
    }

    function appendEntryLinks(parent, entry, options = {}) {
      appendResourceLink(parent, entry.repoUrl, "GitHub");
      appendResourceLink(parent, entry.homepageUrl, entry.homepageLinkLabel || entry.skillsLinkLabel || "Homepage");
      appendResourceLink(parent, entry.sourceUrl, entry.sourceLinkLabel || "Skill source");
      if (options.details !== false && !entry.relatedOnly) {
        const details = document.createElement("a");
        details.className = "resource-link";
        details.href = shareUrl(entry);
        details.textContent = "Details";
        parent.appendChild(details);
      }
    }

    function currentDetailEntry() {
      if (!state.detailResourceId) return null;
      return state.entries.find((candidate) => candidate.id === state.detailResourceId) || null;
    }

    function sourceEcosystem(source) {
      if (typeof source !== "string") return "official";
      if (source.startsWith("vercel:")) return "vercel";
      if (source.startsWith("skillkit:")) return "skillkit";
      if (source.startsWith("mcp-registry:")) return "mcp-registry";
      if (source.startsWith("clawhub:")) return "clawhub";
      return "official";
    }

    function relatedSuggestionEntry(suggestion, ownerEntry) {
      const sourceUrl = suggestion.sourceUrl || sourceHrefFromValue(suggestion.source, suggestion.select);
      return prepareEntry({
        id: `related:${ownerEntry.id}:${text(suggestion.name).toLowerCase()}`,
        name: suggestion.name,
        ecosystem: sourceEcosystem(suggestion.source),
        type: "skill",
        description: suggestion.reason || suggestion.when || "Suggested companion skill.",
        tags: [suggestion.relation || "suggested", ...(Array.isArray(suggestion.select) ? suggestion.select : [])],
        source: suggestion.source || "",
        installCommand: suggestion.installCommand || "",
        repoUrl: null,
        homepageUrl: sourceUrl,
        sourceUrl,
        sourceLinkLabel: "Skill source",
        stars: null,
        lastPush: null,
        archived: false,
        provides: null,
        version: null,
        featured: false,
        subtitle: "Suggested companion",
        relatedOnly: true,
      });
    }

    const genericSimilarityTerms = new Set([
      "agent",
      "agents",
      "catalogue",
      "official",
      "openpack",
      "package",
      "public",
      "public-toolkit",
      "resource",
      "rules",
      "skill",
      "skills",
    ]);

    function meaningfulTerms(entry) {
      const terms = [
        entry.name,
        ...(Array.isArray(entry.tags) ? entry.tags : []),
        ...(Array.isArray(entry.skills) ? entry.skills : []),
      ].flatMap((value) => text(value).toLowerCase().split(/[^a-z0-9]+/));
      return [...new Set(terms.filter((term) => term.length > 2 && !genericSimilarityTerms.has(term)))];
    }

    function similarSkillEntries(entry, usedIds, usedNames, limit) {
      const terms = meaningfulTerms(entry);
      if (!terms.length || limit <= 0) return [];
      return state.entries
        .filter((candidate) => resourceMatches(candidate, "skills"))
        .filter((candidate) => !usedIds.has(candidate.id) && !usedNames.has(text(candidate.name).toLowerCase()))
        .map((candidate) => {
          const candidateText = [candidate.name, candidate.description, ...(Array.isArray(candidate.tags) ? candidate.tags : [])]
            .join(" ")
            .toLowerCase();
          const score = terms.reduce((total, term) => total + (candidateText.includes(term) ? 1 : 0), 0);
          return { candidate, score };
        })
        .filter((item) => item.score > 0)
        .sort((a, b) => b.score - a.score || text(a.candidate.name).localeCompare(text(b.candidate.name)))
        .slice(0, limit)
        .map((item) => item.candidate);
    }

    function relatedSkillEntries(entry) {
      const related = [];
      const usedIds = new Set([entry.id]);
      const usedNames = new Set([text(entry.name).toLowerCase()]);

      function add(candidate) {
        if (!candidate) return;
        const name = text(candidate.name).toLowerCase();
        if (!name || usedIds.has(candidate.id) || usedNames.has(name)) return;
        usedIds.add(candidate.id);
        usedNames.add(name);
        related.push(candidate);
      }

      for (const suggestion of Array.isArray(entry.suggestedSkills) ? entry.suggestedSkills : []) {
        add(findSkillEntry(suggestion.name) || relatedSuggestionEntry(suggestion, entry));
      }

      for (const candidate of similarSkillEntries(entry, usedIds, usedNames, Math.max(0, 8 - related.length))) {
        add(candidate);
      }

      return related;
    }

    function catalogueSearchUrl(query) {
      const url = new URL(location.href);
      url.searchParams.delete("resource");
      url.searchParams.set("q", text(query));
      url.hash = "";
      return url.href;
    }

    function findSkillEntry(name) {
      const wanted = text(name).toLowerCase();
      if (!wanted) return null;
      return state.entries.find((entry) => text(entry.name).toLowerCase() === wanted && resourceMatches(entry, "skills")) || null;
    }

    function selectedSelectors(entry) {
      const selectors = [];
      if (Array.isArray(entry.select)) selectors.push(...entry.select.filter(Boolean));
      if (Array.isArray(entry.skills)) selectors.push(...entry.skills.filter(Boolean).map((skill) => `skills/${skill}`));
      if (!selectors.length && Array.isArray(entry.provides)) {
        selectors.push(...entry.provides.filter(Boolean).map((type) => `${type}/`));
      }
      return [...new Set(selectors)];
    }

    function updateDocumentMetadata(entry) {
      const title = entry ? `${text(entry.name)} - Catalogue - agentwheel` : "Catalogue - agentwheel";
      const description = entry?.description || "Browse agentwheel-installable resources from the official registry, Vercel skills.sh, and SkillKit-compatible repositories.";
      const url = entry ? detailUrl(entry) : catalogueUrl();
      document.title = title;
      document.querySelector('meta[name="description"]')?.setAttribute("content", description);
      document.querySelector('meta[property="og:title"]')?.setAttribute("content", title);
      document.querySelector('meta[property="og:description"]')?.setAttribute("content", description);
      document.querySelector('meta[property="og:url"]')?.setAttribute("content", url);
    }

    function detailSection(title) {
      const section = document.createElement("section");
      section.className = "detail-section";
      section.appendChild(appendText(document.createElement("h3"), title));
      const list = document.createElement("div");
      list.className = "detail-list";
      section.appendChild(list);
      return { section, list };
    }

    function detailItemTitle(parent, label, href) {
      const title = document.createElement("div");
      title.className = "detail-item-title";
      const safe = safeUrl(href);
      if (safe) {
        const link = document.createElement("a");
        link.href = safe;
        link.textContent = text(label);
        title.appendChild(link);
      } else {
        title.appendChild(appendText(document.createElement("span"), label));
      }
      parent.appendChild(title);
      return title;
    }

    function appendDetailNote(parent, value) {
      if (!value) return;
      const note = document.createElement("p");
      note.className = "detail-note";
      note.textContent = text(value);
      parent.appendChild(note);
    }

    function appendDetailCode(parent, value) {
      if (!value) return;
      const code = document.createElement("code");
      code.className = "detail-code";
      code.textContent = text(value);
      parent.appendChild(code);
    }

    function compactPills(values) {
      const filtered = values.filter((value) => value != null && text(value).trim());
      return filtered.length ? pillList(filtered, "detail-pills") : null;
    }

    function appendMiniInstall(parent, command) {
      if (typeof command !== "string" || !command.trim()) return;
      const install = document.createElement("div");
      install.className = "install detail-mini-install";
      const code = document.createElement("code");
      code.textContent = command;
      const copy = document.createElement("button");
      copy.className = "copy";
      copy.type = "button";
      copy.textContent = "Copy";
      copy.dataset.copy = command;
      install.appendChild(code);
      install.appendChild(copy);
      parent.appendChild(install);
    }

    function relationshipText(item) {
      const selector = item?.selector || item?.name || item?.source;
      if (!selector) return "";
      return item.optional ? `${selector} (optional)` : selector;
    }

    function sourceHrefFromValue(source, select) {
      if (typeof source !== "string") return null;
      const selectors = Array.isArray(select) ? select : [];
      const skillSelector = selectors.find((selector) => typeof selector === "string" && selector.startsWith("skills/"));
      const skill = skillSelector ? skillSelector.slice("skills/".length) : "";
      const github = /^github:([^/\s#]+)\/([^/\s#]+)(?:#([^#]+))?$/.exec(source)
        || /^git:https:\/\/github\.com\/([^/\s#]+)\/([^/\s#]+?)(?:\.git)?(?:#([^#]+))?$/.exec(source);
      if (github) {
        const ref = github[3] || "main";
        return skill
          ? `https://github.com/${github[1]}/${github[2]}/tree/${encodeURIComponent(ref)}/skills/${encodeURIComponent(skill)}`
          : `https://github.com/${github[1]}/${github[2]}`;
      }
      const vercel = /^vercel:skills\.sh\/([^/\s#]+)\/([^/\s#]+)(?:\/([^/\s#]+))?(?:#.*)?$/.exec(source);
      if (vercel) {
        const sourceSkill = vercel[3] || skill;
        return sourceSkill
          ? `https://skills.sh/${vercel[1]}/${vercel[2]}/${encodeURIComponent(sourceSkill)}`
          : `https://skills.sh/${vercel[1]}/${vercel[2]}`;
      }
      return safeUrl(source);
    }

    function entryDocumentation(entry) {
      if (entry.readmeExcerpt) {
        return {
          title: entry.readmeTitle || "README",
          url: entry.readmeUrl,
          excerpt: entry.readmeExcerpt,
        };
      }
      const artifact = Array.isArray(entry.artifactMetadata)
        ? entry.artifactMetadata.find((item) => item?.readmeExcerpt)
        : null;
      if (!artifact) return null;
      return {
        title: artifact.readmeTitle || "README",
        url: artifact.readmeUrl,
        excerpt: artifact.readmeExcerpt,
      };
    }

    function renderReadme(entry) {
      const documentation = entryDocumentation(entry);
      if (!documentation) return null;

      const { section, list } = detailSection(documentation.title);
      const item = document.createElement("div");
      item.className = "detail-item";
      detailItemTitle(item, documentation.url ? `Open ${documentation.title}` : documentation.title, documentation.url);
      appendDetailNote(item, documentation.excerpt);
      list.appendChild(item);
      return section;
    }

    function renderArtifacts(entry) {
      const metadata = Array.isArray(entry.artifactMetadata) && entry.artifactMetadata.length
        ? entry.artifactMetadata
        : selectedSelectors(entry).map((selector) => {
          const [type, ...nameParts] = selector.split("/");
          return { selector, type, name: nameParts.join("/") || selector, sourceUrl: entry.sourceUrl };
        });
      if (!metadata.length) return null;

      const { section, list } = detailSection("Selected artifacts");
      metadata.forEach((artifact) => {
        const item = document.createElement("div");
        item.className = "detail-item";
        detailItemTitle(item, artifact.name || artifact.selector, artifact.sourceUrl);
        const pills = compactPills([
          artifact.selector,
          artifact.format,
          artifact.required ? "required" : null,
          ...(Array.isArray(artifact.runtimes) ? artifact.runtimes : []),
        ]);
        if (pills) item.appendChild(pills);
        if (artifact.sourcePath) appendDetailNote(item, `Source path: ${artifact.sourcePath}`);
        if (Array.isArray(artifact.requires) && artifact.requires.length) {
          appendDetailNote(item, `Requires: ${artifact.requires.map(relationshipText).filter(Boolean).join(", ")}`);
        }
        if (Array.isArray(artifact.compose) && artifact.compose.length) {
          appendDetailNote(item, `Composes: ${artifact.compose.map(relationshipText).filter(Boolean).join(", ")}`);
        }
        if (Array.isArray(artifact.suggests) && artifact.suggests.length) {
          appendDetailNote(item, `Suggests: ${artifact.suggests.join(", ")}`);
        }
        list.appendChild(item);
      });
      return section;
    }

    function suggestionHref(suggestion) {
      if (suggestion?.sourceUrl) return suggestion.sourceUrl;
      const fromSource = sourceHrefFromValue(suggestion?.source, suggestion?.select);
      if (fromSource) return fromSource;
      const catalogueEntry = findSkillEntry(suggestion?.name);
      return catalogueEntry ? detailUrl(catalogueEntry) : catalogueSearchUrl(suggestion?.name);
    }

    function renderSuggestedSkills(entry) {
      const suggestions = Array.isArray(entry.suggestedSkills) ? entry.suggestedSkills : [];
      if (!suggestions.length) return null;

      const { section, list } = detailSection("Suggested skills");
      suggestions.forEach((suggestion) => {
        const item = document.createElement("div");
        item.className = "detail-item";
        detailItemTitle(item, suggestion.name, suggestionHref(suggestion));
        const pills = compactPills([
          suggestion.relation || "suggested",
          ...(Array.isArray(suggestion.select) ? suggestion.select : []),
        ]);
        if (pills) item.appendChild(pills);
        appendDetailNote(item, suggestion.reason);
        appendDetailNote(item, suggestion.when);
        appendMiniInstall(item, suggestion.installCommand);
        list.appendChild(item);
      });
      return section;
    }

    function renderDependencies(entry) {
      const dependencies = Array.isArray(entry.dependencies) ? entry.dependencies : [];
      if (!dependencies.length) return null;

      const { section, list } = detailSection("Dependencies");
      dependencies.forEach((dependency) => {
        const item = document.createElement("div");
        item.className = "detail-item";
        detailItemTitle(item, dependency.name, dependency.sourceUrl || sourceHrefFromValue(dependency.source, dependency.select));
        const pills = compactPills([
          dependency.optional ? "optional" : "required",
          ...(Array.isArray(dependency.select) ? dependency.select : []),
          ...(Array.isArray(dependency.runtimes) ? dependency.runtimes : []),
        ]);
        if (pills) item.appendChild(pills);
        appendDetailCode(item, dependency.source);
        appendMiniInstall(item, dependency.installCommand);
        list.appendChild(item);
      });
      return section;
    }

    function renderPackageMetadata(entry) {
      const values = [
        ["Type", entry.type],
        ["Source", entry.source],
        ["Version", entry.version ? `v${entry.version}` : null],
        ["Updated", formatDate(entry.lastPush)],
        ["Stars", formatStars(entry.stars)],
      ].filter(([, value]) => value);
      if (!values.length && !Array.isArray(entry.provides) && !Array.isArray(entry.tags)) return null;

      const { section, list } = detailSection("Metadata");
      values.forEach(([label, value]) => {
        const item = document.createElement("div");
        item.className = "detail-item";
        detailItemTitle(item, label);
        appendDetailCode(item, value);
        list.appendChild(item);
      });
      if (Array.isArray(entry.provides) && entry.provides.length) {
        const item = document.createElement("div");
        item.className = "detail-item";
        detailItemTitle(item, "Provides");
        item.appendChild(pillList(entry.provides, "provides"));
        list.appendChild(item);
      }
      if (Array.isArray(entry.tags) && entry.tags.length) {
        const item = document.createElement("div");
        item.className = "detail-item";
        detailItemTitle(item, "Tags");
        item.appendChild(pillList(entry.tags, "tags"));
        list.appendChild(item);
      }
      return section;
    }

    function resourceCard(entry) {
      const card = document.createElement("article");
      card.className = "resource-card";
      card.style.setProperty("--accent-color", ecosystemColor(entry.ecosystem));

      const top = document.createElement("div");
      top.className = "card-top";

      const titleWrap = document.createElement("div");
      titleWrap.className = "card-title";
      const title = document.createElement("h2");
      const titleLink = document.createElement("a");
      titleLink.href = cardHref(entry);
      titleLink.textContent = text(entry.name);
      title.appendChild(titleLink);
      if (entry.version) {
        const version = document.createElement("span");
        version.className = "version";
        version.textContent = `v${text(entry.version)}`;
        title.appendChild(version);
      }
      titleWrap.appendChild(title);
      if (entry.subtitle) {
        const subtitle = document.createElement("p");
        subtitle.className = "subtitle";
        subtitle.textContent = text(entry.subtitle);
        titleWrap.appendChild(subtitle);
      }
      top.appendChild(titleWrap);

      const badge = document.createElement("span");
      badge.className = `badge ${text(entry.ecosystem)}`;
      badge.textContent = ecosystemLabel(entry.ecosystem);
      top.appendChild(badge);
      card.appendChild(top);

      if (entry.description) {
        const description = document.createElement("p");
        description.className = "description";
        description.textContent = text(entry.description);
        card.appendChild(description);
      }

      if (Array.isArray(entry.tags) && entry.tags.length) {
        card.appendChild(pillList(entry.tags, "tags"));
      }

      if (Array.isArray(entry.provides) && entry.provides.length) {
        card.appendChild(pillList(entry.provides, "provides"));
      }

      const meta = document.createElement("div");
      meta.className = "meta";
      const stars = formatStars(entry.stars);
      const updated = formatDate(entry.lastPush);
      if (entry.featured) {
        const featured = document.createElement("span");
        featured.className = "featured-chip";
        featured.textContent = "featured";
        meta.appendChild(featured);
      }
      if (stars) {
        const star = document.createElement("span");
        star.className = "star";
        star.textContent = "★";
        meta.appendChild(star);
        meta.appendChild(appendText(document.createElement("span"), stars));
      }
      if (stars && updated) {
        meta.appendChild(appendText(document.createElement("span"), "·"));
      }
      if (updated) {
        meta.appendChild(appendText(document.createElement("span"), `updated ${updated}`));
      }
      if (entry.archived) {
        const archived = document.createElement("span");
        archived.className = "archive";
        archived.textContent = "archived";
        meta.appendChild(archived);
      }
      card.appendChild(meta);

      if (typeof entry.installCommand === "string" && entry.installCommand.trim()) {
        const install = document.createElement("div");
        install.className = "install";
        const code = document.createElement("code");
        code.textContent = entry.installCommand;
        const copy = document.createElement("button");
        copy.className = "copy";
        copy.type = "button";
        copy.textContent = "Copy";
        copy.dataset.copy = entry.installCommand;
        install.appendChild(code);
        install.appendChild(copy);
        card.appendChild(install);
      }

      const links = document.createElement("div");
      links.className = "links";
      appendEntryLinks(links, entry);
      card.appendChild(links);

      return card;
    }

    function renderDetail() {
      if (!state.detailResourceId) {
        detailPanel.hidden = true;
        updateDocumentMetadata(null);
        return;
      }

      while (detailPanel.firstChild) detailPanel.removeChild(detailPanel.firstChild);
      detailPanel.hidden = false;

      const entry = state.entries.find((candidate) => candidate.id === state.detailResourceId);
      if (!entry) {
        updateDocumentMetadata(null);
        const actions = document.createElement("div");
        actions.className = "detail-actions";
        const back = document.createElement("a");
        back.className = "button secondary";
        back.href = catalogueUrl();
        back.textContent = "Back to catalogue";
        actions.appendChild(back);
        detailPanel.appendChild(actions);
        const title = document.createElement("h2");
        title.textContent = "Resource details";
        const message = document.createElement("p");
        message.textContent = state.entries.length ? "This resource was not found in the loaded catalogue data." : "Loading resource details...";
        detailPanel.appendChild(title);
        detailPanel.appendChild(message);
        return;
      }

      updateDocumentMetadata(entry);

      const actions = document.createElement("div");
      actions.className = "detail-actions";
      const back = document.createElement("a");
      back.className = "button secondary";
      back.href = catalogueUrl();
      back.textContent = "Back to catalogue";
      actions.appendChild(back);
      const browseSkills = document.createElement("a");
      browseSkills.className = "button secondary";
      browseSkills.href = catalogueSearchUrl(entry.name);
      browseSkills.textContent = "Search catalogue";
      actions.appendChild(browseSkills);
      const share = document.createElement("button");
      share.className = "button secondary";
      share.type = "button";
      share.textContent = "Share";
      share.title = "Share or copy a social-preview link";
      share.addEventListener("click", () => shareResource(entry, share));
      actions.appendChild(share);
      detailPanel.appendChild(actions);

      const top = document.createElement("div");
      top.className = "detail-top";
      const copy = document.createElement("div");
      const title = document.createElement("h2");
      title.textContent = text(entry.name);
      copy.appendChild(title);
      if (entry.description) {
        const description = document.createElement("p");
        description.textContent = text(entry.description);
        copy.appendChild(description);
      }
      top.appendChild(copy);

      const badge = document.createElement("span");
      badge.className = `badge ${text(entry.ecosystem)}`;
      badge.textContent = ecosystemLabel(entry.ecosystem);
      top.appendChild(badge);
      detailPanel.appendChild(top);

      if (typeof entry.installCommand === "string" && entry.installCommand.trim()) {
        const install = document.createElement("div");
        install.className = "install";
        const code = document.createElement("code");
        code.textContent = entry.installCommand;
        const copyButton = document.createElement("button");
        copyButton.className = "copy";
        copyButton.type = "button";
        copyButton.textContent = "Copy";
        copyButton.dataset.copy = entry.installCommand;
        install.appendChild(code);
        install.appendChild(copyButton);
        detailPanel.appendChild(install);
      }

      const links = document.createElement("div");
      links.className = "detail-links";
      appendEntryLinks(links, entry, { details: false });
      detailPanel.appendChild(links);

      const meta = document.createElement("div");
      meta.className = "detail-meta";
      if (Array.isArray(entry.tags) && entry.tags.length) meta.appendChild(pillList(entry.tags, "tags"));
      if (Array.isArray(entry.provides) && entry.provides.length) meta.appendChild(pillList(entry.provides, "provides"));
      if (meta.childNodes.length) detailPanel.appendChild(meta);

      const sections = document.createElement("div");
      sections.className = "detail-grid";
      [
        renderReadme(entry),
        renderArtifacts(entry),
        renderSuggestedSkills(entry),
        renderDependencies(entry),
        renderPackageMetadata(entry),
      ].filter(Boolean).forEach((section) => sections.appendChild(section));
      if (sections.childNodes.length) detailPanel.appendChild(sections);
    }

    function filteredEntries() {
      const detailEntry = currentDetailEntry();
      if (state.detailResourceId) {
        return detailEntry ? relatedSkillEntries(detailEntry) : [];
      }

      const query = state.query.trim().toLowerCase();
      const filtered = state.entries.filter((entry) => {
        if (state.ecosystem !== "all" && entry.ecosystem !== state.ecosystem) return false;
        if (state.resource !== "all" && !resourceMatches(entry, state.resource)) return false;
        if (!query) return true;
        if (!entry.searchText.includes(query)) return false;
        entry.matchTier = matchTier(entry, query);
        return true;
      });

      filtered.sort((a, b) => {
        if (query) {
          const tierDiff = a.matchTier - b.matchTier;
          if (tierDiff !== 0) return tierDiff;
          if (a.matchTier === 0) {
            const exactPriorityDiff = a.exactMatchPriority - b.exactMatchPriority;
            if (exactPriorityDiff !== 0) return exactPriorityDiff;
          }
        }
        if (state.sort === "name") {
          return text(a.name) < text(b.name) ? -1 : text(a.name) > text(b.name) ? 1 : 0;
        }
        if (state.sort === "recent") {
          const timeDiff = b.lastPushTime - a.lastPushTime;
          if (timeDiff !== 0) return timeDiff;
          return text(a.name) < text(b.name) ? -1 : text(a.name) > text(b.name) ? 1 : 0;
        }
        const aHasStars = typeof a.stars === "number";
        const bHasStars = typeof b.stars === "number";
        if (aHasStars && bHasStars && b.stars !== a.stars) return b.stars - a.stars;
        if (aHasStars && !bHasStars) return -1;
        if (!aHasStars && bHasStars) return 1;
        return text(a.name) < text(b.name) ? -1 : text(a.name) > text(b.name) ? 1 : 0;
      });

      return filtered;
    }

    function appendBatch() {
      const fragment = document.createDocumentFragment();
      const nextEntries = state.filteredEntries.slice(state.renderedCount, state.renderedCount + PAGE_SIZE);
      nextEntries.forEach((entry) => fragment.appendChild(resourceCard(entry)));
      state.renderedCount += nextEntries.length;

      const remaining = state.filteredEntries.length - state.renderedCount;
      if (remaining > 0) {
        const row = document.createElement("div");
        row.className = "show-more-row";
        const button = document.createElement("button");
        button.className = "show-more";
        button.type = "button";
        button.dataset.showMore = "true";
        button.textContent = `Show more (${remaining} remaining)`;
        row.appendChild(button);
        fragment.appendChild(row);
      }

      grid.appendChild(fragment);
    }

    function render(reset = true) {
      const entries = filteredEntries();
      const detailMode = Boolean(state.detailResourceId);
      state.filteredEntries = entries;
      renderDetail();
      clearGrid();
      resultsTitle.textContent = detailMode ? "Related skills" : "Resources";
      count.textContent = detailMode
        ? `${entries.length} ${entries.length === 1 ? "related skill" : "related skills"}`
        : `${entries.length} ${entries.length === 1 ? "resource" : "resources"}`;
      if (!entries.length) {
        showState(
          "empty",
          detailMode ? "No related skills yet" : "No resources match",
          detailMode ? "Use the catalogue search to explore all installable resources." : "Try a different search, ecosystem, resource, or sort combination.",
          detailMode ? "0 related skills" : "0 resources",
        );
        return;
      }
      state.renderedCount = 0;
      appendBatch();
    }

    queryInput.addEventListener("input", (event) => {
      state.query = event.target.value;
      window.clearTimeout(searchTimer);
      searchTimer = window.setTimeout(() => render(), 150);
    });

    sortSelect.addEventListener("change", (event) => {
      state.sort = event.target.value;
      render();
    });

    document.querySelectorAll("[data-filter]").forEach((button) => {
      button.addEventListener("click", () => {
        state[button.dataset.filter] = button.dataset.value;
        setPressed(button.dataset.filter, button.dataset.value);
        render();
      });
    });

    document.addEventListener("click", (event) => {
      const copyButton = event.target.closest("[data-copy]");
      if (copyButton) {
        copyText(copyButton.dataset.copy, copyButton);
        return;
      }
    });

    grid.addEventListener("click", (event) => {
      const showMoreButton = event.target.closest("[data-show-more]");
      if (showMoreButton && grid.contains(showMoreButton)) {
        showMoreButton.closest(".show-more-row")?.remove();
        appendBatch();
      }
    });

    async function loadVercelIndex() {
      try {
        const response = await fetch(VERCEL_INDEX_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const bytes = await response.arrayBuffer();
        const data = JSON.parse(new TextDecoder().decode(bytes));
        const existingIds = new Set(state.entries.map((entry) => entry.id));
        const additions = [];

        for (const record of Array.isArray(data.entries) ? data.entries : []) {
          if (!record || typeof record.o !== "string" || typeof record.r !== "string" || typeof record.s !== "string") continue;
          if (!record.o.trim() || !record.r.trim() || !record.s.trim()) continue;
          const id = `vercel:${record.o}/${record.r}/${record.s}`;
          if (existingIds.has(id)) continue;
          const entry = vercelIndexEntry(record);
          existingIds.add(entry.id);
          additions.push(entry);
        }

        if (additions.length) {
          state.entries = state.entries.concat(additions);
          updateFilterVisibility();
          render();
        }
        return await sha256Hex(bytes);
      } catch (error) {
        console.warn(`Vercel index unavailable: ${error.message}`);
        return null;
      }
    }

    async function sha256Hex(bytes) {
      if (!globalThis.crypto?.subtle) return null;
      const digest = await crypto.subtle.digest("SHA-256", bytes);
      return [...new Uint8Array(digest)].map((byte) => byte.toString(16).padStart(2, "0")).join("");
    }

    async function load() {
      showSkeletons();
      try {
        const response = await fetch(DATA_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const bytes = await response.arrayBuffer();
        const data = JSON.parse(new TextDecoder().decode(bytes));
        state.entries = Array.isArray(data.entries) ? data.entries.map(prepareEntry) : [];
        updateFilterVisibility();
        render();
        const [enrichedDigest, vercelDigest] = await Promise.all([
          sha256Hex(bytes),
          loadVercelIndex(),
        ]);
        resolveCatalogueReady({
          entries: state.entries,
          digests: { enriched: enrichedDigest, vercel: vercelDigest },
        });
      } catch (error) {
        resolveCatalogueReady({ entries: [], digests: {}, error: error.message || String(error) });
        showState("error", "Catalogue data is temporarily unavailable", "The registry data could not be loaded right now.");
      }
    }

    load();
  </script>
  <script type="module" src="./semantic-search-demo.js"></script>
</body>
